<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Aplicacion Web para subir y publicar fotos de los lugares que has visitado a tu perfil, con la opcion de dar likes."
    />
    <meta name="author" content="Mauricio Olvera" />
    <meta
      name="keywords"
      content="red social, fotos, paisajes, like, viajes, aplicacion"
    />
    <title>Around the U.S.</title>
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon" />
  </head>
  <body class="background">
    <div class="page">
      <header class="header">
        <img
          src="./images/Logo.svg"
          alt="Logotipo de aplicación Around the U.S."
          class="header__logo"
        />
      </header>
      <main class="content">
        <section class="profile">
          <div class="profile__avatar-container">
            <img
              src="./images/Mauricio_Olvera_profilePicture.avif"
              alt="Foto de perfil del usuario"
              class="profile__image"
            />
            <div class="profile__avatar-overlay">
              <img src="./images/Edit_Icon.svg" alt="Editar avatar" />
            </div>
          </div>
          <div class="profile__info">
            <div class="profile__info-group">
              <h1 class="profile__name">Mauricio Olvera</h1>
              <button
                type="button"
                class="profile__edit-button"
                aria-label="Editar perfil"
              >
                <img src="./images/Edit_Button.svg" alt="" />
              </button>
            </div>
            <p class="profile__description">Aspirante a Desarrollador Web</p>
          </div>
          <button
            type="button"
            class="profile__add-button"
            aria-label="Añadir nueva tarjeta"
          >
            <img
              src="./images/Add_Icon.svg"
              alt=""
              class="profile__add-button-icon"
            />
          </button>
        </section>
        <section class="elements"></section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">&#169; 2025 Around The U.S.</p>
      </footer>
    </div>

    <!-- Popup: Editar Perfil -->
    <div class="popup" id="popup-edit-info">
      <div class="popup__container">
        <form class="popup__form" name="edit-info" novalidate>
          <h2 class="popup__title">Editar Perfil</h2>
          <label class="popup__field">
            <input
              type="text"
              placeholder="Nombre"
              id="name-input"
              name="edit-name"
              class="popup__input popup__input_type_name"
              minlength="2"
              maxlength="40"
              required
            />
            <span class="popup__error name-input-error"></span>
          </label>
          <label class="popup__field">
            <input
              type="text"
              placeholder="Acerca de mí"
              id="description-input"
              name="edit-description"
              class="popup__input popup__input_type_description"
              minlength="2"
              maxlength="200"
              required
            />
            <span class="popup__error description-input-error"></span>
          </label>
          <button type="submit" class="popup__button">Guardar</button>
          <button
            type="button"
            class="popup__close-button"
            aria-label="Cerrar ventana"
          >
            <img src="./images/Close_Icon.svg" alt="" />
          </button>
        </form>
      </div>
    </div>

    <!-- Popup: Añadir Nueva Tarjeta -->
    <div class="popup" id="popup-add-post">
      <div class="popup__container">
        <form class="popup__form" name="add-post" novalidate>
          <h2 class="popup__title">Nuevo Lugar</h2>
          <label class="popup__field">
            <input
              type="text"
              placeholder="Título"
              id="title-input"
              name="add-title"
              class="popup__input popup__input_type_name"
              minlength="2"
              maxlength="30"
              required
            />
            <span class="popup__error title-input-error"></span>
          </label>
          <label class="popup__field">
            <input
              type="url"
              placeholder="Enlace a la imagen"
              id="link-input"
              name="add-link"
              class="popup__input popup__input_type_description"
              required
            />
            <span class="popup__error link-input-error"></span>
          </label>
          <button type="submit" class="popup__button">Crear</button>
          <button
            type="button"
            class="popup__close-button"
            aria-label="Cerrar ventana"
          >
            <img src="./images/Close_Icon.svg" alt="" />
          </button>
        </form>
      </div>
    </div>

    <!-- Popup: Imagen Ampliada -->
    <div class="popup" id="popup-full-image">
      <div class="popup__container popup__container_image">
        <div class="popup__image-container">
          <img src=" " alt=" " class="popup__image" />
          <h2 class="popup__image-title"></h2>
          <button
            type="button"
            class="popup__close-button popup__close-button_image"
            aria-label="Cerrar imagen"
          >
            <img src="./images/Close_Icon.svg" alt="" />
          </button>
        </div>
      </div>
    </div>

    <!-- Popup: Actualizar Avatar -->
    <div class="popup" id="popup-update-avatar">
      <div class="popup__container">
        <form class="popup__form" name="update-avatar" novalidate>
          <h2 class="popup__title">Cambiar foto de perfil</h2>
          <label class="popup__field">
            <input
              type="url"
              placeholder="Enlace a la imagen"
              id="avatar-link"
              name="avatar-link"
              class="popup__input popup__input_type_description"
              required
            />
            <span class="popup__error avatar-link-error"></span>
          </label>
          <button type="submit" class="popup__button">Guardar</button>
          <button
            type="button"
            class="popup__close-button"
            aria-label="Cerrar ventana"
          >
            <img src="./images/Close_Icon.svg" alt="" />
          </button>
        </form>
      </div>
    </div>

    <!-- Popup: Confirmación Eliminar -->
    <div class="popup" id="popup-confirmation">
      <div class="popup__container">
        <form class="popup__form" name="confirmation" novalidate>
          <h2 class="popup__title">¿Estás seguro?</h2>
          <p class="popup__text">Esta acción no se puede deshacer.</p>
          <button type="submit" class="popup__button">Sí</button>
          <button
            type="button"
            class="popup__close-button"
            aria-label="Cerrar ventana"
          >
            <img src="./images/Close_Icon.svg" alt="" />
          </button>
        </form>
      </div>
    </div>

    <!-- Template para Tarjetas -->
    <template id="element-template">
      <article class="element">
        <img src="" alt="" class="element__image" />
        <button
          type="button"
          class="element__trash"
          aria-label="Eliminar tarjeta"
        >
          <img src="./images/Trash.svg" alt="" />
        </button>
        <div class="element__info">
          <p class="element__name"></p>
          <div class="element__like-container">
            <button
              type="button"
              class="element__like"
              aria-label="Dar me gusta"
            ></button>
            <span class="element__like-count">0</span>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
